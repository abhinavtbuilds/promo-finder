# Free tier: https://console.groq.com  ->  export LLM_KEY=gsk_...
# Free tier = 8k tokens/minute, i.e. about one episode a minute, so run a slice:  --limit 10
llm:
  provider: openai_compatible
  base_url: https://api.groq.com/openai/v1
  model: openai/gpt-oss-120b
  api_key_env: LLM_KEY
  temperature: 0.2
  extra: {reasoning_effort: low}   # gpt-oss thinks before answering; keep it short
  min_interval_s: 65.0
shortlist_per_episode: 5
max_promos_per_episode: 3
stitched_candidates: 6
judge_batch: 6
post_first_n: 10
report_top: 15
weights: {hook: 0.40, cliffhanger: 0.35, clarity: 0.25, rule_blend: 0.15}
llm_stitches: 6
