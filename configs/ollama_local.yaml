# Fully offline: `ollama pull llama3.1` then `ollama serve`. No key needed (any value works).
llm:
  provider: openai_compatible
  base_url: http://localhost:11434/v1
  model: llama3.1
  api_key_env: LLM_KEY
  temperature: 0.2
  min_interval_s: 0
shortlist_per_episode: 5
max_promos_per_episode: 3
stitched_candidates: 6
judge_batch: 6
post_first_n: 10
report_top: 15
weights: {hook: 0.40, cliffhanger: 0.35, clarity: 0.25, rule_blend: 0.15}
llm_stitches: 6
