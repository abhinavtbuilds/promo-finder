# Free tier: https://aistudio.google.com/apikey  ->  export LLM_KEY=AIza...
llm:
  provider: gemini
  model: gemini-2.5-flash
  api_key_env: LLM_KEY
  temperature: 0.2
  min_interval_s: 4.0
shortlist_per_episode: 5
max_promos_per_episode: 3
stitched_candidates: 6
judge_batch: 6
post_first_n: 10
report_top: 15
weights: {hook: 0.40, cliffhanger: 0.35, clarity: 0.25, rule_blend: 0.15}
llm_stitches: 6
